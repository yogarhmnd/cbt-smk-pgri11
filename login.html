<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login CBT - SMK PGRI 11 CILEDUG</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://unpkg.com/lucide@latest"></script>

  <!-- Firebase Compatibility SDK & Firestore Cloud DB -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
  <script src="firebase-config.js"></script>

  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen flex items-center justify-center p-4 relative overflow-hidden">

  <!-- Background Ambient Batik Watermark -->
  <div class="fixed inset-0 opacity-[0.04] bg-repeat bg-[length:260px_260px] pointer-events-none" style="background-image: url('assets/batik-ornament.jpg');"></div>

  <div class="max-w-md w-full bg-white rounded-3xl shadow-2xl border border-slate-200 overflow-hidden relative z-10">
    <!-- Header Brand with Batik Overlay -->
    <div class="bg-gradient-to-r from-[#0087CE] via-[#0072C6] to-[#00569E] p-8 text-white text-center relative overflow-hidden">
      <!-- Batik Watermark in Header -->
      <div class="absolute inset-0 opacity-15 mix-blend-overlay bg-repeat bg-[length:180px_180px] pointer-events-none" style="background-image: url('assets/batik-ornament.jpg');"></div>
      
      <div class="relative z-10">
        <div class="w-16 h-16 bg-white/15 backdrop-blur-md rounded-2xl flex items-center justify-center mx-auto mb-3 border border-white/25 shadow-inner">
          <i data-lucide="graduation-cap" class="w-9 h-9 text-white"></i>
        </div>
        <h1 class="text-xl font-extrabold tracking-tight">CBT SEJARAH INDONESIA</h1>
        <p class="text-xs text-blue-100 font-medium mt-1">SMK PGRI 11 CILEDUG KOTA TANGERANG</p>
      </div>
    </div>

    <!-- Role Tab Selector -->
    <div class="flex border-b border-slate-200 bg-slate-50 text-xs font-bold">
      <button id="tab-student" onclick="setRole('student')" class="flex-1 py-3.5 text-center text-blue-700 border-b-2 border-blue-700 bg-white transition">
        <i data-lucide="user" class="w-3.5 h-3.5 inline mr-1"></i> Peserta Ujian (Siswa)
      </button>
      <button id="tab-teacher" onclick="setRole('teacher')" class="flex-1 py-3.5 text-center text-slate-500 hover:text-slate-700 transition">
        <i data-lucide="shield-check" class="w-3.5 h-3.5 inline mr-1"></i> Admin / Guru
      </button>
    </div>

    <!-- Form Container -->
    <div class="p-8">
      <form id="login-form" onsubmit="handleLogin(event)" class="space-y-5">
        
        <!-- Field Identifier (NISN or NIP) -->
        <div>
          <label id="label-identifier" class="block text-xs font-bold text-slate-700 uppercase tracking-wider mb-2">
            Nomor Induk Siswa Nasional (NISN)
          </label>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <i id="icon-identifier" data-lucide="id-card" class="w-5 h-5"></i>
            </span>
            <input type="text" id="input-identifier" required placeholder="Contoh: 0067829102"
              class="w-full pl-11 pr-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 focus:bg-white transition" />
          </div>
        </div>

        <!-- Field Password / Token -->
        <div>
          <div class="flex items-center justify-between mb-2">
            <label id="label-password" class="block text-xs font-bold text-slate-700 uppercase tracking-wider">
              Token Ujian / Password
            </label>
            <span class="text-[11px] text-blue-600 font-medium">Token sesi: <strong class="font-mono">SEJ-2026</strong></span>
          </div>
          <div class="relative">
            <span class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-slate-400">
              <i data-lucide="key" class="w-5 h-5"></i>
            </span>
            <input type="password" id="input-password" required placeholder="Masukkan password/token"
              class="w-full pl-11 pr-4 py-2.5 bg-slate-50 border border-slate-300 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-blue-600 focus:bg-white transition" />
          </div>
        </div>

        <!-- Submit Button -->
        <button type="submit" class="w-full py-3 px-4 bg-blue-700 hover:bg-blue-800 text-white font-bold rounded-xl shadow-lg shadow-blue-700/30 flex items-center justify-center space-x-2 transition active:scale-[0.98]">
          <span>Masuk ke Ruang Ujian</span>
          <i data-lucide="arrow-right" class="w-4 h-4"></i>
        </button>
      </form>

      <!-- Quick Demo Info -->
      <div class="mt-6 pt-5 border-t border-slate-100 text-center">
        <p class="text-xs text-slate-500">
          Untuk simulasi langsung: <br>
          Siswa: <span class="font-semibold text-slate-700">NISN Bebas</span> | Guru: klik tab <span class="font-semibold text-blue-700">Admin/Guru</span>
        </p>
      </div>
    </div>
  </div>

  <script>
    let currentRole = 'student';

    function setRole(role) {
      currentRole = role;
      const tabStudent = document.getElementById('tab-student');
      const tabTeacher = document.getElementById('tab-teacher');
      const labelIdentifier = document.getElementById('label-identifier');
      const inputIdentifier = document.getElementById('input-identifier');
      const labelPassword = document.getElementById('label-password');

      if (role === 'student') {
        tabStudent.className = "flex-1 py-3.5 text-center text-blue-700 border-b-2 border-blue-700 bg-white transition";
        tabTeacher.className = "flex-1 py-3.5 text-center text-slate-500 hover:text-slate-700 bg-slate-50 transition";
        labelIdentifier.innerText = "Nomor Induk Siswa Nasional (NISN)";
        inputIdentifier.placeholder = "Contoh: 0067829102";
        inputIdentifier.value = "0067829102";
        document.getElementById('input-password').value = "SEJ-2026";
      } else {
        tabTeacher.className = "flex-1 py-3.5 text-center text-blue-700 border-b-2 border-blue-700 bg-white transition";
        tabStudent.className = "flex-1 py-3.5 text-center text-slate-500 hover:text-slate-700 bg-slate-50 transition";
        labelIdentifier.innerText = "NIP / Akun Guru (Yoga Rahmanda, S.Pd)";
        inputIdentifier.placeholder = "Contoh: 198507122010011005";
        inputIdentifier.value = "guru.sejarah@smkpgri11.sch.id";
        document.getElementById('input-password').value = "admin123";
      }
      lucide.createIcons();
    }

    function handleLogin(e) {
      e.preventDefault();
      const identifier = document.getElementById('input-identifier').value.trim();
      
      if (currentRole === 'student') {
        localStorage.setItem('cbt_student_nisn', identifier || '0067829102');
        localStorage.setItem('cbt_student_name', 'Ahmad Fauzi');
        localStorage.setItem('cbt_student_class', 'XII RPL 1');
        window.location.href = 'index.html';
      } else {
        localStorage.setItem('cbt_teacher_auth', 'true');
        window.location.href = 'admin.html';
      }
    }

    // Auto-fill default test data
    setRole('student');
  </script>
</body>
</html>
